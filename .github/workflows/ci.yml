name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore VoCards.slnx

      # Warnings are errors in Directory.Build.props, so this also enforces
      # analyzer and code-style rules.
      - name: Build
        run: dotnet build VoCards.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test VoCards.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results
          if-no-files-found: ignore

  publish:
    name: Publish the WebAssembly app
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish src/VoCards.Web/VoCards.Web.csproj
          --configuration Release
          --output ./artifacts/publish

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: vocards-wwwroot
          path: ./artifacts/publish/wwwroot
