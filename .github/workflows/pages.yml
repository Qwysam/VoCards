name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# One deployment at a time; queued runs supersede rather than cancel, so an
# in-flight deployment is never left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish src/VoCards.Web/VoCards.Web.csproj
          --configuration Release
          --output ./publish

      # Pages serves the site from /<repo>/, so the base href has to match or
      # every asset resolves against the domain root and 404s.
      - name: Rewrite the base href for the project subpath
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|g' \
            ./publish/wwwroot/index.html
          sed -i 's|const base = "/";|const base = "/${{ github.event.repository.name }}/";|g' \
            ./publish/wwwroot/service-worker.published.js || true

      # Pages runs Jekyll by default, which strips files and folders beginning
      # with an underscore - including Blazor's entire _framework directory.
      - name: Disable Jekyll processing
        run: touch ./publish/wwwroot/.nojekyll

      # A client-side router needs every unknown path to serve the app shell.
      - name: Add a SPA fallback
        run: cp ./publish/wwwroot/index.html ./publish/wwwroot/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish/wwwroot

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
