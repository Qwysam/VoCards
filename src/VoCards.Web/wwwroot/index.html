<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VoCards — spaced-repetition vocabulary</title>
    <base href="/" />

    <meta name="description"
          content="VoCards is a local-first flashcard app with SM-2 and FSRS spaced repetition, six study modes and no account required." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;750&display=swap" />

    <link rel="stylesheet" href="css/app.css" />

    <!-- Stamp the stored theme before Blazor boots, so there is no flash of the
         wrong colour scheme while the runtime downloads. -->
    <script type="module">
        import { bootTheme } from "./js/vocards.js";
        bootTheme();
    </script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="13" height="16" rx="2.5" />
                    <path d="M8 5V3.5A1.5 1.5 0 0 1 9.5 2h9A1.5 1.5 0 0 1 20 3.5v13a1.5 1.5 0 0 1-1.5 1.5H16" />
                </svg>
            </div>
            <p class="boot-name">VoCards</p>
            <div class="boot-bar"><span></span></div>
            <p class="boot-note">Loading your library…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span>Something went wrong. Reloading usually fixes it — your library is saved in this browser.</span>
        <a href="" class="reload">Reload</a>
        <a class="dismiss" role="button" aria-label="Dismiss">🗙</a>
    </div>

    <style>
        /* Inline so the boot screen renders before any stylesheet resolves. */
        .boot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            min-height: 100dvh;
            padding: 2rem;
            text-align: center;
        }

        .boot-mark {
            display: grid;
            place-items: center;
            width: 3rem;
            height: 3rem;
            color: #fff;
            border-radius: 0.9rem;
            background: linear-gradient(145deg, #9781ee, #5334ae);
            box-shadow: 0 8px 24px rgba(124, 95, 230, 0.32);
        }

        .boot-name {
            font-family: Outfit, system-ui, sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .boot-bar {
            width: min(14rem, 60vw);
            height: 4px;
            overflow: hidden;
            border-radius: 999px;
            background: var(--surface-3, #e9e9e5);
        }

        .boot-bar span {
            display: block;
            width: 40%;
            height: 100%;
            border-radius: inherit;
            background: #7c5fe6;
            animation: boot-slide 1.1s ease-in-out infinite;
        }

        @keyframes boot-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }

        .boot-note {
            font-size: 0.8125rem;
            color: var(--text-muted, #79776f);
        }

        #blazor-error-ui {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            align-items: center;
            gap: 1rem;
            padding: 0.875rem 1.25rem;
            font-size: 0.875rem;
            color: #16160f;
            background: #fbeecd;
            box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.2);
        }

        #blazor-error-ui .dismiss {
            margin-left: auto;
            cursor: pointer;
        }
    </style>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Register the service worker only in production; the dev server serves
        // a no-op worker that would otherwise cache stale assets.
        navigator.serviceWorker?.register("service-worker.js");
    </script>
</body>

</html>
